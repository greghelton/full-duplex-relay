[workspace]

[package]
name = "full-duplex-relay"
version = "0.1.0"
edition = "2024"
description = "Full-duplex browser chat relay using SSE — Rust port of FullDuplexRelay.java"

[dependencies]
tokio        = { version = "1",  features = ["full"] }
axum         = { version = "0.7" }
dashmap      = { version = "6" }
tokio-stream = { version = "0.1", features = ["sync"] }
serde        = { version = "1", features = ["derive"] }
